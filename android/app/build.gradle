// Full-game Android app module — SCAFFOLD ONLY, NOT WIRED IN.
// android/settings.gradle does NOT include ':app' yet: there is no native
// target (the executable must become a shared 'main' library), no
// LauncherActivity/GameActivity, and no JNI bridge. Those land in the full
// port AFTER the RT64 probe (android/probe/) passes on device.
// See android/app/README_SCAFFOLD.md. Do not add `include ':app'` until
// the probe gate passes and the native target exists.
//
// Adapted from AeroGauge's android/app/build.gradle (AGP 8.9.2, NDK
// 28.2.13676358, minSdk 28, targetSdk/compileSdk 35, arm64-v8a only).
// Package name is PROPOSED (io.github.rayishere0.roadrash64); Ray decides.
plugins { id 'com.android.application' }

def repoRoot = rootProject.projectDir.parentFile
def releaseVersion = System.getenv('RR64_VERSION') ?: '1.4.9'
def versionMatch = releaseVersion =~ /^v?(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/
if (!versionMatch.matches()) throw new GradleException('RR64_VERSION must be a semantic version')
def parts = (1..3).collect { versionMatch.group(it).toInteger() }
if (parts[1] > 999 || parts[2] > 999) throw new GradleException('Version components must fit the APK version code')

android {
    namespace 'io.github.rayishere0.roadrash64'
    compileSdk 35
    ndkVersion "28.2.13676358"
    lint { lintConfig file('../lint.xml') }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'io.github.rayishere0.roadrash64'
        minSdk 28
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName releaseVersion.replaceFirst('^v', '')
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    sourceSets.main {
        java.srcDir "${repoRoot}/build-android/deps/SDL/android-project/app/src/main/java"
        jniLibs.srcDir "${repoRoot}/build-android/package/jniLibs"
        assets.srcDir "${repoRoot}/build-android/package/assets"
    }
    // AdrenoTools loads extracted hooks (Turnip driver import).
    packagingOptions.jniLibs.useLegacyPackaging = true
}

tasks.register('checkReleaseSigning') {
    doLast {
        ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Release signing requires ${it}")
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkReleaseSigning' }
