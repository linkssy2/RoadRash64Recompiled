# N64Recomp bootstrap configuration for Road Rash 64 (USA v1.0).
#
# IMPORTANT (symbols-file mode): current upstream N64Recomp automatically
# recognizes and renames its built-in libultra ignored/reimplemented symbols
# before it applies this config's [patches] lists. Do not duplicate those
# built-in names here (for example __osExceptionPreamble or __osException),
# because their effective names have already become *_recomp at that point.

[input]
entrypoint = 0x80000400
output_func_path = "../build/RecompiledFuncs"
symbols_file_path = "../symbols/roadrash64.us.syms.bootstrap.toml"
rom_file_path = "../build/roadrash64.us.z64"
functions_per_output_file = 50
uses_mips3_float_mode = false
unpaired_lo16_warnings = true
recomp_include = """#include "recomp.h"
#include "rr64_native.hpp"
"""

[patches]
stubs = [
    # Multiplayer forced catch-up only. The sole caller at 8006B128 gates
    # this on >=2 players and human racers. It moves a trailing racer near
    # the leader and charges a penalty. Keep ordinary recovery (8003FE48)
    # and the shared relocation helper (80068E20) intact.
    "func_8003FD60",

    # Early boot cache sweeps. Native host memory is coherent; these N64 CACHE
    # instructions have no host-side work to perform.
    "func_800097EC",
    "func_80009808",

    # Early boot exception/debug path. The exception body is replaced and the
    # register-dump helper contains broad CP0 reads that are unreachable once
    # that body is stubbed.
    "__osException_8000983C",
    "func_80009C50",
]
ignored = [
    # This split tail is Road-Rash-specific and is NOT one of N64Recomp's
    # built-in libultra symbol names, so it remains explicit here.
    "__osExceptionTail_80089A78",
]
renamed = []

